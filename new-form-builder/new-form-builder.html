          const captionMarkup = labelConfig.show ? `        <caption${lblStyle}>${labelConfig.text}</caption>\n` : '';
          return `    <div class="field-group table-group"${groupStyle}>
      <table${tableAria} style="table-layout:fixed;width:${tableWidth};border-collapse:collapse${fsPx ? ';font-size:'+fsPx : ''}">
${captionMarkup}        <colgroup>
${cols}
         </colgroup>
        <thead>
          <tr>
${ths}
          </tr>
        </thead>
        <tbody>
${trs}
        </tbody>
      </table>
    </div>`;
        }
        const labelMarkup = labelConfig.show ? `<label for="${id}"${lblStyle}>${labelConfig.text}</label>` : '';
        if (labelConfig.position === 'left') {
          return `    <div class="field-group field-group--label-left"${groupStyle}>
      ${labelMarkup}
      <input type="${field.type}" id="${id}" name="${id}"${field.value ? ` value="${escAttr(field.value)}"` : ''}${ctrlStyle}${controlAria}>
    </div>`;
        }
        return `    <div class="field-group"${groupStyle}>
      ${labelMarkup}
      <input type="${field.type}" id="${id}" name="${id}"${field.value ? ` value="${escAttr(field.value)}"` : ''}${ctrlStyle}${controlAria}>
    </div>`;
      }).join('\n\n');

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${pageTitle}</title>
  <style>
    @page { size: A4 portrait; margin: 15mm 20mm; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0 auto;
      padding: 20px;
      color: #1e293b;
      background: #f8fafc;
    }
    @media print {
      body { background: white; padding: 0; }
      input, textarea, select { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media screen {
      body { background: #e5e7eb; padding: 30px; }
      form { background: white; padding: 30px; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: inline-block; }
    }
    .form-canvas { position: relative; width: ${canvasW}px; height: ${canvasH}px; }
    .field-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .field-group--label-left { flex-direction: row; align-items: center; gap: 0.6rem; }
    .field-group--label-left label { flex-shrink: 0; }
    .field-group--label-left input, .field-group--label-left textarea { flex: 1; }
    label { font-size: 0.875rem; font-weight: 600; color: #374151; }
    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="password"],
    input[type="tel"],
    input[type="url"],
    textarea,
    select {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1e293b;
      background: white;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    textarea { resize: vertical; min-height: 80px; }
    fieldset { border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 0.75rem 1rem; }
    legend { font-size: 0.875rem; font-weight: 600; color: #374151; padding: 0 0.25rem; }
    .checkbox-label, .radio-label {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 400; font-size: 0.9rem; cursor: pointer; margin-bottom: 0.25rem;
    }
    input[type="checkbox"], input[type="radio"] { width: auto; accent-color: #2563eb; }
    .table-group { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    caption { font-size: 0.875rem; font-weight: 600; color: #374151; text-align: left; margin-bottom: 0.5rem; }
    th { background: #f1f5f9; font-weight: 600; color: #374151; padding: 0.45rem 0.6rem; border: 1.5px solid #d1d5db; text-align: left; }
    td { padding: 0.2rem; border: 1.5px solid #e2e8f0; }
    td input[type="text"] { border: none; border-radius: 0; padding: 0.3rem 0.5rem; font-size: 0.875rem; box-shadow: none; }
    td input[type="text"]:focus { outline: 2px solid #2563eb; outline-offset: -2px; border-color: transparent; box-shadow: none; }
  </style>
</head>
<body>
  <form>
    <div class="form-canvas">
${fieldsHTML}
    </div>
  </form>
${autoPrintScript}
</body>
</html>`;
    }

    function exportFile() {
      if (fields.length === 0) {
        alert('Add at least one field before exporting.');
        return;
      }
      const html = generateHTML();
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'form.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    function printPreview() {
      if (fields.length === 0) {
        alert('Add at least one field before previewing.');
        return;
      }
      const html = generateHTML({ autoPrint: true });
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const win = window.open('about:blank', '_blank');
      if (!win) {
        URL.revokeObjectURL(url);
        alert('Print preview was blocked. Allow popups for this page and try again.');
        return;
      }
      try { win.opener = null; } catch {}
      win.location = url;
      window.setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    new MutationObserver(mutations => {
      for (const { addedNodes } of mutations) {
        for (const node of addedNodes) {
          if (node.nodeType !== 1) continue;
          const inputs = node.matches('input[type="text"],input[type="number"],textarea')
            ? [node] : [...node.querySelectorAll('input[type="text"],input[type="number"],textarea')];
          inputs.forEach(el => { el.spellcheck = false; el.autocomplete = 'off'; });
        }
      }
    }).observe(document.body, { childList: true, subtree: true });

    renderPalette();
    renderCanvas();
    initDropZone();
    saveSnapshot(); // capture initial empty state
    document.getElementById('undo-btn').addEventListener('click', undo);
    document.getElementById('redo-btn').addEventListener('click', redo);
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && !e.shiftKey && e.key === 'z') { e.preventDefault(); undo(); }
      if ((e.ctrlKey && e.key === 'y') || (e.ctrlKey && e.shiftKey && e.key === 'z')) { e.preventDefault(); redo(); }
    });
    document.getElementById('snap-btn').addEventListener('click', () => {
      snapToGrid = !snapToGrid;
      document.getElementById('snap-btn').textContent = `Snap to Grid: ${snapToGrid ? 'On' : 'Off'}`;
      document.getElementById('drop-zone').classList.toggle('snap-grid', snapToGrid);
    });
    document.getElementById('save-btn').addEventListener('click', saveLayout);
    const loadInput = document.getElementById('load-input');
    document.getElementById('load-btn').addEventListener('click', () => loadInput.click());
    loadInput.addEventListener('change', (e) => {
      if (e.target.files[0]) { loadLayout(e.target.files[0]); loadInput.value = ''; }
    });
    document.getElementById('preview-btn').addEventListener('click', printPreview);
    document.getElementById('export-btn').addEventListener('click', exportFile);
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (fields.length === 0) { alert('Add at least one field before copying.'); return; }
      const html = generateHTML();
      const btn = document.getElementById('copy-btn');
      function markCopied() {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy HTML'; }, 2000);
      }
      function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = html;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { markCopied(); } else { alert('Copy failed. Please copy the HTML manually via Export HTML.'); }
      }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(html).then(markCopied).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });

    document.getElementById('copy-flow-btn').addEventListener('click', () => {
      if (fields.length === 0) { alert('Add at least one field before copying.'); return; }
      const json = JSON.stringify({ generatedHTML: generateHTML() }).replace(/&#39;/g, "'");
      const btn = document.getElementById('copy-flow-btn');
      function markCopied() {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy as Flow JSON'; }, 2000);
      }
      function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = json;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { markCopied(); } else { alert('Copy failed.'); }
      }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(json).then(markCopied).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  </script>
</body>
</html>
