<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Platform Solution Explorer</title>
<style>
:root {
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-xl: 1.25rem;
  --bg-app: linear-gradient(135deg, #e8eaf0 0%, #d4d8e2 100%);
  --glass-bg: rgba(255,255,255,0.82); --glass-border: rgba(100,116,139,0.25);
  --glass-shadow: 0 4px 16px 0 rgba(31,38,135,0.10); --glass-blur: 8px;
  --text-main: #0f172a; --text-muted: #475569;
  --btn-primary: rgba(255,255,255,0.85); --btn-hover: rgba(241,245,249,0.95);
}
.glass-panel {
  background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 16px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body { width:100%; height:100%; overflow:hidden; font-family:var(--font-sans);
  background:var(--bg-app); color:var(--text-main); line-height:1.5; }

#reset-btn {
  padding:6px 14px; border-radius:20px; border:1px solid rgba(99,102,241,0.35);
  background:rgba(99,102,241,0.12); color:#6366f1; cursor:pointer;
  font-size:var(--text-sm); font-family:var(--font-sans);
  backdrop-filter:blur(var(--glass-blur)); transition:background 0.2s;
}
#reset-btn:hover { background:rgba(99,102,241,0.22); }

#export-btn {
  padding:6px 14px; border-radius:20px; border:1px solid rgba(16,185,129,0.35);
  background:rgba(16,185,129,0.12); color:#10b981; cursor:pointer;
  font-size:var(--text-sm); font-family:var(--font-sans);
  backdrop-filter:blur(var(--glass-blur)); transition:background 0.2s;
}
#export-btn:hover { background:rgba(16,185,129,0.22); }
.export-wrap { position:relative; display:inline-block; }
.export-menu {
  position:absolute; top:calc(100% + 6px); right:0;
  background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border); border-radius:10px;
  box-shadow:var(--glass-shadow); overflow:hidden;
  display:none; z-index:200; min-width:136px;
}
.export-menu.open { display:block; }
.export-menu button {
  display:block; width:100%; padding:8px 16px;
  text-align:left; border:none; background:none;
  cursor:pointer; font-size:var(--text-sm); font-family:var(--font-sans);
  color:var(--text-main); transition:background 0.15s;
}
.export-menu button:hover { background:var(--btn-hover); }

.zoom-btn {
  width:28px; height:28px; border-radius:50%; border:1px solid var(--glass-border);
  background:var(--btn-primary); color:var(--text-main); cursor:pointer;
  font-size:var(--text-base); font-family:var(--font-sans); line-height:1;
  backdrop-filter:blur(var(--glass-blur)); transition:background 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.zoom-btn:hover { background:var(--btn-hover); }

.toggle-btn {
  padding:5px 12px; border-radius:20px; border:1px solid rgba(148,163,184,0.35);
  background:rgba(255,255,255,0.70); color:var(--text-muted); cursor:pointer;
  font-size:var(--text-xs); font-family:var(--font-sans);
  backdrop-filter:blur(var(--glass-blur)); transition:background 0.2s,opacity 0.2s;
  white-space:nowrap;
}
.toggle-btn:hover { background:var(--btn-hover); }
.toggle-btn--off { opacity:0.45; text-decoration:line-through; }

#drop-zone {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  background:var(--bg-app); z-index:100;
}
#drop-area {
  width:480px; max-width:90vw; padding:48px 48px 36px;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  border:2px dashed var(--glass-border); border-radius:16px;
  background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur));
  text-align:center; transition:border-color 0.2s, background 0.2s;
  position:relative;
}
#drop-area-credit {
  position:absolute; bottom:10px; left:14px;
  font-size:0.6rem; color:var(--text-muted); opacity:0.55; letter-spacing:0.02em;
}
#drop-zone.drag-over #drop-area { border-color:#3b82f6; background:rgba(59,130,246,0.1); }
.drop-icon { font-size:3rem; }
#drop-area h2 { font-size:var(--text-xl); }
#drop-area p { color:var(--text-muted); font-size:var(--text-sm); }
#file-input { display:none; }
.browse-btn {
  padding:8px 20px; border-radius:8px; border:1px solid var(--glass-border);
  background:var(--btn-primary); color:var(--text-main); cursor:pointer;
  font-size:var(--text-sm); font-family:var(--font-sans); transition:background 0.2s;
  display:inline-block;
}
.browse-btn:hover { background:var(--btn-hover); }
#error-msg { color:#ef4444; font-size:var(--text-sm); display:none; margin-top:4px; }

#main-layout { display:none; width:100vw; height:100vh; overflow:hidden; }

#svg-panel {
  flex: 1; width:100%; height:100vh; overflow:hidden;
  padding:12px; display:flex; flex-direction:column; gap:10px;
}
#svg-panel-header {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
  font-size:var(--text-sm); color:var(--text-muted);
  flex-wrap:wrap;
}
#dep-graph { display:block; flex:1; width:100%; min-height:0; cursor:grab; }
#dep-graph.panning { cursor:grabbing; }

#legend {
  display:flex; flex-wrap:wrap; gap:10px; flex:1;
}
.legend-item { display:flex; align-items:center; gap:5px; font-size:0.65rem; color:var(--text-muted); }
.legend-line { width:24px; height:2px; border-radius:1px; }

.svg-node { cursor:pointer; }
.svg-node.svg-dimmed { opacity:0.2; }
.svg-node.svg-hovered .svg-node-rect { stroke-width:2.5 !important; filter:brightness(1.25); }
.svg-node.svg-selected .svg-node-rect { stroke-width:3 !important; filter:brightness(1.3); }
.svg-node.svg-peer .svg-node-rect { stroke-width:2.5 !important; }
.svg-edge.edge-dimmed { opacity:0.06; }
.svg-edge.edge-highlighted path { stroke-width:2.5 !important; }
.col-label { font-size:13px; font-family:system-ui,sans-serif; font-weight:700;
  text-anchor:middle; letter-spacing:0.08em; fill:#9ca3af; }

#loading-overlay {
  position:fixed; inset:0; z-index:200; display:none; align-items:center;
  justify-content:center; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
}
#loading-overlay.active { display:flex; }
#loading-msg {
  padding:20px 32px; border-radius:12px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  color:var(--text-main); font-size:var(--text-base);
}
</style>
</head>
<body>

<div id="loading-overlay"><div id="loading-msg">Parsing...</div></div>

<div id="drop-zone">
  <div id="drop-area">
    <div class="drop-icon">📦</div>
    <h2>Power Platform Solution Explorer</h2>
    <p>Drop a Power Platform Solution ZIP, Canvas App Package ZIP, or .msapp file</p>
    <label class="browse-btn" id="browse-label">Browse file</label>
    <input type="file" id="file-input" accept=".zip,.msapp">
    <div id="error-msg"></div>
    <span id="drop-area-credit">Created by James Barrineau | v1.0</span>
  </div>
</div>

<div id="main-layout">
  <div id="svg-panel">
  <span style="position:fixed;bottom:10px;left:14px;font-size:0.75rem;color:var(--text-muted);opacity:0.85;letter-spacing:0.02em;pointer-events:none;">Created by James Barrineau | v1.0</span>
    <div id="svg-panel-header">
      <span id="solution-name" style="font-weight:600;color:var(--text-main);"></span>
      <div id="legend"></div>
      <button id="toggle-envvar-btn"   class="toggle-btn" style="display:none">⚙ Env Vars</button>
      <button id="toggle-inactive-btn" class="toggle-btn" style="display:none">≋ Inactive Flows</button>
      <div class="export-wrap">
        <button id="export-btn">Export ▾</button>
        <div class="export-menu" id="export-menu">
          <button id="export-svg-btn">Download SVG</button>
          <button id="export-png-btn">Download PNG</button>
        </div>
      </div>
      <button id="reset-btn">Upload New Package</button>
    </div>
    <div id="zoom-controls" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:50;">
      <button class="zoom-btn" id="zoom-out-btn" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoom-fit-btn" title="Fit to view">⊡</button>
      <button class="zoom-btn" id="zoom-in-btn" title="Zoom in">+</button>
    </div>
    <svg id="dep-graph">
      <defs id="svg-defs"></defs>
      <g id="transform-layer">
        <g id="groups-layer"></g>
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
  </div>
</div>

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────────────
const FILE_SIZE_LIMIT = 1_048_576;
const SKIP_BY_NAME = new Set([
  'References/Themes.json','References/Templates.json',
  'References\\Themes.json','References\\Templates.json',
  'Src/_EditorState.pa.yaml','Src\\_EditorState.pa.yaml',
]);

const ZIP_EOCD_SIG = 0x06054b50;
const ZIP_CD_SIG   = 0x02014b50;

const TYPE_ICONS = {canvasapp:'',flow:'≋',datasource:'📋',dataverse:'🔷',control:'🧩',screen:'🖥️',envvar:'⚙'};
const TYPE_LABELS = {canvasapp:'Canvas App',flow:'Flow',datasource:'Data Source',dataverse:'Dataverse Table',control:'Control',screen:'Screen',envvar:'Environment Variable'};

const EDGE_COLORS = {
  'app-calls-flow':'#3b82f6',
  'flow-calls-flow':'#8b5cf6',
  'flow-reads-data':'#f43f5e',
  'app-uses-data':'#10b981',
  'screen-uses-data':'#06b6d4',
  'screen-calls-flow':'#38bdf8',
  'flow-uses-envvar':'#f97316',
  'app-uses-envvar':'#fb923c',
  'screen-uses-envvar':'#fdba74',
};
const EDGE_LABELS = {
  'app-calls-flow':'Calls flow',
  'flow-calls-flow':'Calls child flow',
  'flow-reads-data':'Reads data',
  'app-uses-data':'Uses data',
  'screen-uses-data':'Screen uses data',
  'screen-calls-flow':'Screen calls flow',
  'flow-uses-envvar':'Flow uses config',
  'app-uses-envvar':'App uses config',
  'screen-uses-envvar':'Screen uses config',
};

const SVG_PAD_X = 72, SVG_PAD_Y = 72;
const COL_W = 248, COL_GAP = 130;
const NODE_H = 68, NODE_GAP_Y = 14, NODE_RX = 10, NODE_LABEL_MAX_CHARS = 26;
const GROUP_PAD_X = 10, GROUP_PAD_Y = 8;
const GROUP_GAP = 20, GROUP_LABEL_H = 14;
const ZOOM_MIN = 0.05, ZOOM_MAX = 4, FIT_PAD = 24;

const COL_MAP = {datasource:0,dataverse:0,envvar:0,flow:1,canvasapp:2,control:2,screen:2};
const COL_LABELS = ['Data & Config','Flows','Apps'];

const TYPE_COLORS = {
  canvasapp:  {fill:'#2d0e2b',stroke:'#902D87'},
  flow:       {fill:'#0066FF',stroke:'#8b5cf6',text:'#001433',icon:'#6FBBFF'},
  datasource: {fill:'#038387',stroke:'#f59e0b',text:'#001a1b'},
  dataverse:  {fill:'#00B050',stroke:'#22d3ee',text:'#002510'},
  control:    {fill:'#1a1a2e',stroke:'#6b7280'},
  screen:     {fill:'#D973BD',stroke:'#902D87',text:'#3d1535'},
  envvar:     {fill:'#1c1400',stroke:'#d97706',text:'#fef3c7'},
};

// ── Utilities (early) ─────────────────────────────────────────────────────────
const ENV_VAR_TYPE_LABELS = {
  '100000000':'Text','100000001':'Decimal','100000002':'Boolean',
  '100000003':'JSON','100000004':'Data Source','100000005':'Secret',
};
function envVarTypeLabel(typeCode) {
  return ENV_VAR_TYPE_LABELS[typeCode] || 'Environment Variable';
}

function extractSiteName(url) {
  if (!url) return '';
  try {
    const u = new URL(url);
    const parts = u.pathname.split('/').filter(Boolean);
    const idx = parts.indexOf('sites');
    if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
    return u.hostname;
  } catch { return url; }
}

// ── ZIP Parser ─────────────────────────────────────────────────────────────────
function parseZip(buf) {
  const bytes = new Uint8Array(buf instanceof ArrayBuffer ? buf : buf.buffer);
  const ab = bytes.buffer;
  const view = new DataView(ab);

  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) {
    if (view.getUint32(i, true) === ZIP_EOCD_SIG) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid ZIP file');

  // Detect ZIP64: sentinel values (0xFFFF / 0xFFFFFFFF) in the EOCD indicate a
  // ZIP64 locator must be present — reject early rather than silently misparse.
  const cdCount  = view.getUint16(eocd + 10, true);
  const cdOffset = view.getUint32(eocd + 16, true);
  if (cdCount === 0xFFFF || cdOffset === 0xFFFFFFFF) {
    throw new Error('ZIP64 format is not supported. Please use a standard ZIP file.');
  }

  const entries = [], map = new Map();
  let pos = cdOffset;
  for (let i = 0; i < cdCount; i++) {
    if (view.getUint32(pos, true) !== ZIP_CD_SIG) break;
    const method    = view.getUint16(pos + 10, true);
    const compSize  = view.getUint32(pos + 20, true);
    const uncompSize= view.getUint32(pos + 24, true);
    const fnLen     = view.getUint16(pos + 28, true);
    const extraLen  = view.getUint16(pos + 30, true);
    const cmtLen    = view.getUint16(pos + 32, true);
    const localOff  = view.getUint32(pos + 42, true);
    const fnRaw     = bytes.slice(pos + 46, pos + 46 + fnLen);
    let name;
    try { name = new TextDecoder('utf-8',{fatal:true}).decode(fnRaw); }
    catch { name = new TextDecoder('latin1').decode(fnRaw); console.warn('ZIP entry filename is not valid UTF-8, decoded as latin1:', name); }
    name = name.replace(/\\/g, '/');
    const entry = {name, method, compSize, uncompSize, localOff};
    entries.push(entry);
    map.set(name, entry);
    map.set(name.replace(/\//g,'\\'), entry);
    pos += 46 + fnLen + extraLen + cmtLen;
  }
  return {entries, map, bytes, view, ab};
}

async function decompressBytes(raw, method) {
  if (method === 0) return raw;
  if (method === 8) {
    const ds = new DecompressionStream('deflate-raw');
    const w  = ds.writable.getWriter();
    const r  = ds.readable.getReader();
    w.write(raw); w.close();
    const chunks = []; let total = 0;
    for (;;) { const {done,value} = await r.read(); if (done) break; chunks.push(value); total += value.length; }
    const out = new Uint8Array(total); let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  }
  throw new Error('Unsupported compression: ' + method);
}

async function extractEntry(zip, entry) {
  const {view, bytes} = zip;
  if (entry.localOff + 30 > bytes.length)
    throw new Error(`ZIP entry '${entry.name}' has an invalid local header offset`);
  const fnLen    = view.getUint16(entry.localOff + 26, true);
  const extraLen = view.getUint16(entry.localOff + 28, true);
  const start    = entry.localOff + 30 + fnLen + extraLen;
  const raw      = bytes.slice(start, start + entry.compSize);
  return decompressBytes(raw, entry.method);
}

function findE(zip, name) { return zip.map.get(name) || zip.map.get(name.replace(/\//g,'\\')); }

async function extractText(zip, name) {
  const e = findE(zip, name); if (!e) return null;
  if (e.uncompSize > FILE_SIZE_LIMIT) { console.warn(`Skipping oversized entry: ${name} (${e.uncompSize} bytes)`); return null; }
  const b = await extractEntry(zip, e);
  try { return new TextDecoder('utf-8').decode(b); } catch { return new TextDecoder('latin1').decode(b); }
}

async function extractJson(zip, name) {
  const t = await extractText(zip, name); if (!t) return null;
  try { return JSON.parse(t); } catch { return null; }
}

async function extractSubZip(zip, name) {
  const e = findE(zip, name); if (!e) return null;
  const b = await extractEntry(zip, e);
  try { return parseZip(b.buffer); } catch(err) { console.warn(`Failed to parse nested ZIP: ${name}`, err); return null; }
}

async function extractTopParentName(zip, entry) {
  const {view, bytes} = zip;
  const fnLen    = view.getUint16(entry.localOff + 26, true);
  const extraLen = view.getUint16(entry.localOff + 28, true);
  const start    = entry.localOff + 30 + fnLen + extraLen;
  const raw      = bytes.slice(start, start + entry.compSize);
  let text = '';
  if (entry.method === 0) {
    text = new TextDecoder('utf-8').decode(raw.slice(0, 4096));
  } else if (entry.method === 8) {
    // Stream only the first 4096 bytes to avoid decompressing the whole file
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    const reader = ds.readable.getReader();
    const decoder = new TextDecoder('utf-8');
    writer.write(raw); writer.close();
    let total = 0;
    while (total < 4096) {
      const {done, value} = await reader.read();
      if (done) break;
      text += decoder.decode(value, {stream: true});
      total += value.length;
    }
    reader.cancel().catch(() => {});
  }
  const m = text.match(/"TopParent"\s*:\s*\{[^}]*?"Name"\s*:\s*"([^"]+)"/);
  return m ? m[1] : null;
}

// ── Data Model ─────────────────────────────────────────────────────────────────
function createGraph() {
  return {nodes:new Map(), edges:[], edgeSet:new Set(), pkgToGuid:new Map(), byType:new Map(), flowNameToId:new Map(), cdsEntityMap:new Map(), envVarSchemaNames:new Map()};
}

function guid(s) {
  if (!s) return '';
  return String(s).toLowerCase().replace(/[{}]/g,'').trim();
}

function getOrCreate(g, type, id, data={}) {
  id = guid(id) || id; if (!id) return null;
  if (g.nodes.has(id)) {
    const n = g.nodes.get(id);
    for (const [k, v] of Object.entries(data)) {
      if (v === undefined || v === null) continue;
      // Don't overwrite a real displayName with a bare id (GUID reference with no better name)
      if (k === 'displayName' && v === id && n.displayName !== n.id) continue;
      if (k === 'filePath' && !v) continue;
      if (k === 'siteUrl' && !v) continue;
      n[k] = v;
    }
    return n;
  }
  const n = {id, type, displayName:id, filePath:'', siteUrl:'', sizeOnly:false, sizeBytes:0,
              svgX:0, svgY:0, svgEl:null, ...data};
  g.nodes.set(id, n);
  if (!g.byType.has(type)) g.byType.set(type,[]);
  g.byType.get(type).push(id);
  return n;
}

function addEdge(g, src, dst, type) {
  src = guid(src)||src; dst = guid(dst)||dst;
  if (!src||!dst||src===dst) return;
  const k = `${src}→${dst}→${type}`;
  if (g.edgeSet.has(k)) return;
  g.edgeSet.add(k);
  g.edges.push({srcId:src, dstId:dst, type, svgEl:null});
}

// ── Package Detection ──────────────────────────────────────────────────────────
async function detectType(zip) {
  if (findE(zip,'solution.xml') && findE(zip,'customizations.xml')) return 'solution';
  if (findE(zip,'manifest.json')) return 'app-package';
  if (findE(zip,'Header.json') && findE(zip,'Properties.json')) return 'msapp';
  return 'unknown';
}

// ── Flow Definition ────────────────────────────────────────────────────────────
function walkActions(actions, flowId, g, depth = 0) {
  if (!actions || typeof actions !== 'object' || depth > 30) return;
  for (const a of Object.values(actions)) {
    if (!a) continue;
    const type = a.type || '';
    if (type === 'Workflow') {
      const cid = guid(a.inputs?.host?.workflowReferenceName);
      if (cid) { getOrCreate(g,'flow',cid,{displayName:cid}); addEdge(g,flowId,cid,'flow-calls-flow'); }
    }
    if (type === 'OpenApiConnection') {
      const api = (a.inputs?.host?.apiId||a.inputs?.host?.connection||'').toLowerCase();
      if (api.includes('sharepoint')) {
        const tbl     = a.inputs?.parameters?.table;
        const dataset = a.inputs?.parameters?.dataset;
        // Skip dynamic Power Automate expressions — they're runtime values, not real identifiers
        const isDynamic = v => typeof v === 'string' && v.trimStart().startsWith('@');
        const staticTbl     = isDynamic(tbl)     ? null : tbl;
        const staticDataset = isDynamic(dataset) ? null : dataset;
        const fallback = staticTbl || staticDataset;
        if (fallback) {
          const dsid = guid(fallback)||fallback;
          getOrCreate(g,'datasource',dsid,{displayName:fallback, siteUrl:staticTbl ? (staticDataset||'') : ''});
          addEdge(g,flowId,dsid,'flow-reads-data');
        }
      }
      if (api.includes('commondataservice')) {
        const rawEntityName = a.inputs?.parameters?.entityName || '';
        const entityName = typeof rawEntityName === 'string' && !rawEntityName.trimStart().startsWith('@')
          ? rawEntityName.toLowerCase() : '';
        if (entityName) {
          const displayName = g.cdsEntityMap?.get(entityName) || entityName;
          getOrCreate(g,'dataverse',entityName,{displayName, filePath:entityName});
          addEdge(g,flowId,entityName,'flow-reads-data');
        }
      }
    }
    if (a.actions) walkActions(a.actions,flowId,g,depth+1);
    if (a.else?.actions) walkActions(a.else.actions,flowId,g,depth+1);
    if (a.cases) for (const c of Object.values(a.cases)) if (c.actions) walkActions(c.actions,flowId,g,depth+1);
    if (a.foreach) walkActions(a.foreach,flowId,g,depth+1);
    if (a.branches) for (const b of Object.values(a.branches)) if (b.actions) walkActions(b.actions,flowId,g,depth+1);
  }
}

async function processFlowDef(path, json, g, hintGuid) {
  let fid = hintGuid || '';
  // Solution ZIPs name workflow files "{FlowName}-{GUID}.json" — extract only the trailing GUID
  const m1 = path.match(/[Ww]orkflows\/([^/]+)\.json/);
  if (m1) {
    const trailingGuid = m1[1].match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
    fid = guid(trailingGuid ? trailingGuid[1] : m1[1]);
  }
  const m2 = path.match(/flows\/([^/]+)\/definition\.json/i); if (m2) fid = guid(m2[1]);
  if (!fid) return;

  const props = json.properties || json;
  const name  = props.displayName || props.definition?.description || fid;
  const node  = getOrCreate(g,'flow',fid,{displayName:name, filePath:path});
  if (name && name !== fid) g.flowNameToId.set(name, fid);

  walkActions(props.definition?.actions || props.actions || {}, node.id, g);

  // Environment variable references: parameters whose metadata.schemaName matches a known env var schema
  // Format: "DisplayName (schemaName)" key with metadata.schemaName = "schemaName"
  const params = props.definition?.parameters || props.parameters || {};
  for (const [, val] of Object.entries(params)) {
    const schemaName = val?.metadata?.schemaName;
    if (schemaName) {
      const evId = schemaName.toLowerCase();
      getOrCreate(g, 'envvar', evId, {displayName: schemaName});
      g.envVarSchemaNames.set(evId, evId);
      addEdge(g, node.id, evId, 'flow-uses-envvar');
    }
  }
}

// ── YAML Data Source Scanner ───────────────────────────────────────────────────
function buildYamlPatterns(names, suffix = '', prefix = '=\\s*') {
  return [...names].map(name => ({
    name,
    re: new RegExp(prefix + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + suffix, 'i'),
  }));
}

function scanYamlWithPatterns(text, patterns) {
  const found = new Set();
  for (const {name, re} of patterns) { if (re.test(text)) found.add(name); }
  return found;
}

// ── msapp Processor ────────────────────────────────────────────────────────────
function processMsappConnRefs(refs, appId, g) {
  if (!refs||typeof refs!=='object') return;
  for (const ref of Object.values(refs)) {
    const hints = ref.connectionRef?.parameterHints || ref.connectionRef?.parameterHintsV2
                || ref.parameterHints || ref.parameterHintsV2;
    const wid  = hints?.workflowEntityId?.value;
    const wname= hints?.workflowDisplayName?.value;
    if (wid) {
      const fid = (wname && g.flowNameToId.get(wname)) || guid(wid);
      getOrCreate(g,'flow',fid,{displayName:wname||fid}); addEdge(g,appId,fid,'app-calls-flow');
    }
    for (const [datasetUrl, ds] of Object.entries(ref.datasets||{})) {
      for (const [dsName, src] of Object.entries(ds.dataSources||{})) {
        if (src.tableName) {
          const did=guid(src.tableName)||src.tableName;
          getOrCreate(g,'datasource',did,{displayName:dsName||src.tableName, siteUrl:datasetUrl}); addEdge(g,appId,did,'app-uses-data');
        }
      }
    }
  }
}

function processMsappDS(dsList, appId, g) {
  if (!Array.isArray(dsList)) return;
  for (const ds of dsList) {
    if (ds.Type==='ServiceInfo' && ds.WorkflowEntityId) {
      const fid = g.flowNameToId.get(ds.Name) || guid(ds.WorkflowEntityId);
      getOrCreate(g,'flow',fid,{displayName:ds.Name||fid}); addEdge(g,appId,fid,'app-calls-flow');
    }
    if (ds.TableName) {
      const did=guid(ds.TableName)||ds.TableName;
      getOrCreate(g,'datasource',did,{displayName:ds.Name||ds.TableName, siteUrl:ds.DatasetName||''}); addEdge(g,appId,did,'app-uses-data');
    }
    if (ds.Type==='NativeCDSDataSourceInfo' && ds.LogicalName) {
      const did = ds.LogicalName.toLowerCase();
      getOrCreate(g,'dataverse',did,{displayName:ds.Name||ds.PreferredName||did, filePath:did});
      addEdge(g,appId,did,'app-uses-data');
    }
  }
}

async function processMsapp(msZip, path, g) {
  const props = await extractJson(msZip,'Properties.json');
  let appId = props?.Id ? guid(props.Id) : path;
  const appName = props?.Name || path;
  getOrCreate(g,'canvasapp',appId,{displayName:appName, filePath:path});

  if (props?.LocalConnectionReferences) {
    let r = props.LocalConnectionReferences;
    if (typeof r==='string') { try{r=JSON.parse(r);}catch{} }
    processMsappConnRefs(r,appId,g);
  }

  const dsFile = await extractJson(msZip,'References/DataSources.json');
  if (dsFile?.DataSources) {
    processMsappDS(dsFile.DataSources,appId,g);
    // Detect environment-variable-backed data source references
    for (const ds of dsFile.DataSources) {
      const evRef = ds.EnvironmentVariableReference || ds.environmentVariableReference;
      if (evRef) {
        const evId = (evRef.EnvironmentVariableId || evRef.environmentVariableId || '').toLowerCase();
        if (evId) {
          getOrCreate(g, 'envvar', evId, {displayName: evId});
          g.envVarSchemaNames.set(evId, evId);
          addEdge(g, appId, evId, 'app-uses-envvar');
        }
      }
    }
  }

  // Screen-level data source and flow edges from pa.yaml formula scanning
  const dsNameToId = new Map();
  for (const [id, node] of g.nodes) {
    if (node.type === 'datasource' || node.type === 'dataverse') dsNameToId.set(node.displayName, id);
  }
  const flowNameToId = new Map(g.flowNameToId);
  for (const [id, node] of g.nodes) {
    if (node.type === 'flow' && node.displayName && node.displayName !== id)
      flowNameToId.set(node.displayName, id);
  }
  // Pre-compile regexes once before scanning all YAML files
  const dsPatterns   = buildYamlPatterns(dsNameToId.keys(), '\\b');
  const flowPatterns = buildYamlPatterns(flowNameToId.keys(), '\\.Run\\b', '');
  for (const entry of msZip.entries) {
    if (SKIP_BY_NAME.has(entry.name)) continue;
    if (!/^Src\//i.test(entry.name) || !entry.name.endsWith('.pa.yaml')) continue;
    if (entry.uncompSize > FILE_SIZE_LIMIT) continue;
    const text = await extractText(msZip, entry.name);
    if (!text) continue;
    const screenName = entry.name.replace(/^Src\//i,'').replace('.pa.yaml','');
    const screenId = `${appId}::scr::${screenName}`;
    for (const name of scanYamlWithPatterns(text, dsPatterns)) {
      getOrCreate(g,'screen',screenId,{displayName:screenName});
      addEdge(g, screenId, dsNameToId.get(name), 'screen-uses-data');
    }
    for (const name of scanYamlWithPatterns(text, flowPatterns)) {
      getOrCreate(g,'screen',screenId,{displayName:screenName});
      addEdge(g, screenId, flowNameToId.get(name), 'screen-calls-flow');
    }
    // Scan for Power Fx environment variable references: EnvironmentVariables.publisher_varname
    for (const [, evName] of text.matchAll(/\bEnvironmentVariables\.([a-zA-Z_][a-zA-Z0-9_]*)/g)) {
      const evId = evName.toLowerCase();
      getOrCreate(g, 'envvar', evId, {displayName: evId});
      g.envVarSchemaNames.set(evId, evId);
      getOrCreate(g, 'screen', screenId, {displayName: screenName});
      addEdge(g, screenId, evId, 'screen-uses-envvar');
    }
  }

  const yamlScreens = new Set();
  for (const entry of msZip.entries) {
    if (/^Src\//i.test(entry.name) && entry.name.endsWith('.pa.yaml'))
      yamlScreens.add(entry.name.replace(/^Src\//i,'').replace('.pa.yaml',''));
  }
  // Legacy apps have no Src/*.pa.yaml — Controls/*.json TopParent entries ARE the screens
  const isLegacyApp = yamlScreens.size === 0;

  for (const entry of msZip.entries) {
    if (SKIP_BY_NAME.has(entry.name)) continue;
    if (/^Controls\//i.test(entry.name) && entry.name.endsWith('.json')) {
      if (entry.uncompSize > FILE_SIZE_LIMIT) {
        const topName = await extractTopParentName(msZip, entry);
        if (topName && yamlScreens.has(topName)) continue;
        const displayName = topName || entry.name.replace(/^Controls\//i,'').replace('.json','');
        const nodeType = isLegacyApp ? 'screen' : 'control';
        const cid = `${appId}${isLegacyApp ? '::scr::' : '::ctrl::'}${topName || entry.name}`;
        getOrCreate(g, nodeType, cid, {displayName, filePath:entry.name, sizeOnly:true, sizeBytes:entry.uncompSize});
      } else {
        const cj = await extractJson(msZip, entry.name);
        if (cj?.TopParent?.Name && !yamlScreens.has(cj.TopParent.Name)) {
          const nodeType = isLegacyApp ? 'screen' : 'control';
          const cid = `${appId}${isLegacyApp ? '::scr::' : '::ctrl::'}${cj.TopParent.Name}`;
          getOrCreate(g, nodeType, cid, {displayName:cj.TopParent.Name, filePath:entry.name});
        }
      }
    }
    if (/^Src\//i.test(entry.name) && entry.name.endsWith('.pa.yaml')) {
      const sn = entry.name.replace(/^Src\//i,'').replace('.pa.yaml','');
      getOrCreate(g,'screen',`${appId}::scr::${sn}`,{displayName:sn,filePath:entry.name});
    }
  }
}

// ── Solution Pipeline ──────────────────────────────────────────────────────────
async function processSolution(zip, g) {
  const solTxt = await extractText(zip, 'solution.xml');
  if (solTxt) {
    const solDom = new DOMParser().parseFromString(solTxt, 'text/xml');
    g.solutionName = solDom.querySelector('SolutionManifest LocalizedNames LocalizedName')?.getAttribute('description')
                  || solDom.querySelector('SolutionManifest UniqueName')?.textContent
                  || '';
  }

  const custTxt = await extractText(zip,'customizations.xml');
  if (custTxt) {
    const dom = new DOMParser().parseFromString(custTxt,'text/xml');

    for (const wf of dom.querySelectorAll('Workflows Workflow')) {
      const wid  = guid(wf.getAttribute('WorkflowId'));
      const name = wf.getAttribute('Name') || wid;
      const jf   = wf.querySelector('JsonFileName')?.textContent?.trim() || '';
      const stateCode = wf.querySelector('StateCode')?.textContent?.trim();
      const isActive = stateCode !== '0';
      if (wid) { getOrCreate(g,'flow',wid,{displayName:name,filePath:jf,isActive}); if (name && name !== wid) g.flowNameToId.set(name, wid); }
    }

    for (const ca of dom.querySelectorAll('CanvasApps CanvasApp')) {
      const caid = guid(ca.getAttribute('UniqueId')||ca.getAttribute('CanvasAppId'));
      const name = ca.getAttribute('Name')||ca.getAttribute('UniqueName')||caid;
      if (!caid) continue;
      getOrCreate(g,'canvasapp',caid,{displayName:name});

      const crEl = ca.querySelector('ConnectionReferences');
      if (crEl) { let r; try{r=JSON.parse(crEl.textContent);}catch{} if(r) processMsappConnRefs(r,caid,g); }

      const cdEl = ca.querySelector('CdsDependencies');
      if (cdEl) {
        let d; try{d=JSON.parse(cdEl.textContent);}catch{}
        if (d?.cdsdependencies) for (const dep of d.cdsdependencies) {
          if (dep.componenttype===29) {
            const fid=guid(dep.dependencyid); if(fid){getOrCreate(g,'flow',fid,{displayName:fid});addEdge(g,caid,fid,'app-calls-flow');}
          }
        }
      }
    }

    for (const entity of dom.querySelectorAll('Entities Entity')) {
      const logicalName = entity.querySelector('EntityInfo entity')?.getAttribute('Name')?.toLowerCase();
      const displayName = entity.querySelector('Name')?.getAttribute('LocalizedName');
      if (logicalName && displayName) g.cdsEntityMap.set(logicalName, displayName);
    }

    // Environment variable definitions — try both XML conventions used by different exporters
    for (const ev of dom.querySelectorAll('EnvironmentVariableDefinitions EnvironmentVariableDefinition')) {
      const schemaName = ev.getAttribute('schemaname') || ev.getAttribute('SchemaName')
                      || ev.querySelector('SchemaName')?.textContent?.trim()
                      || ev.querySelector('schemaname')?.textContent?.trim();
      const displayName = ev.querySelector('displaynames displayname')?.getAttribute('description')
                       || ev.querySelector('DisplayNames LocalizedName')?.getAttribute('description')
                       || ev.querySelector('DisplayName')?.textContent?.trim()
                       || schemaName;
      const typeCode = ev.querySelector('type')?.textContent?.trim()
                    || ev.querySelector('Type')?.textContent?.trim()
                    || ev.getAttribute('type');
      if (schemaName) {
        const evId = schemaName.toLowerCase();
        getOrCreate(g, 'envvar', evId, {displayName: displayName || schemaName, envVarType: typeCode});
        g.envVarSchemaNames.set(evId, evId);
      }
    }

  }

  // Fallback: scan environmentvariabledefinitions/ folder for individual definition XML files
  for (const entry of zip.entries) {
    if (/^environmentvariabledefinitions\//i.test(entry.name) && entry.name.endsWith('.xml')) {
      const txt = await extractText(zip, entry.name);
      if (!txt) continue;
      const evDom = new DOMParser().parseFromString(txt, 'text/xml');
      const schemaName = evDom.documentElement?.getAttribute('schemaname')
                      || evDom.documentElement?.getAttribute('SchemaName')
                      || evDom.querySelector('SchemaName')?.textContent?.trim();
      const displayName = evDom.querySelector('displayname')?.getAttribute('default')
                       || evDom.querySelector('displayname label')?.getAttribute('description')
                       || evDom.querySelector('DisplayName label')?.getAttribute('description')
                       || schemaName;
      const typeCode = evDom.querySelector('type')?.textContent?.trim()
                    || evDom.querySelector('Type')?.textContent?.trim()
                    || evDom.documentElement?.getAttribute('type');
      if (schemaName) {
        const evId = schemaName.toLowerCase();
        getOrCreate(g, 'envvar', evId, {displayName: displayName || schemaName, envVarType: typeCode});
        g.envVarSchemaNames.set(evId, evId);
      }
    }
  }

  for (const entry of zip.entries) {
    if (/^Workflows\//i.test(entry.name) && entry.name.endsWith('.json')) {
      const j = await extractJson(zip,entry.name);
      if (j) await processFlowDef(entry.name,j,g);
    }
  }
  for (const entry of zip.entries) {
    if (entry.name.endsWith('.msapp')) {
      const sub = await extractSubZip(zip,entry.name);
      if (sub) await processMsapp(sub,entry.name,g);
    }
  }
}

// ── App Package Pipeline ───────────────────────────────────────────────────────
async function processAppPackage(zip, g) {
  const mf = await extractJson(zip,'manifest.json');
  if (mf?.resources) for (const [k,r] of Object.entries(mf.resources)) {
    const eg = guid(r.id||r.entityId||k); if (eg) g.pkgToGuid.set(k,eg);
  }

  for (const entry of zip.entries) {
    const m = entry.name.match(/Microsoft\.Flow\/flows\/([^/]+)\/definition\.json/i);
    if (m) { const j=await extractJson(zip,entry.name); if(j) await processFlowDef(entry.name,j,g,guid(m[1])); }
  }
  const appFoldersWithMsapp = new Set();
  for (const entry of zip.entries) {
    if (entry.name.endsWith('.msapp')) appFoldersWithMsapp.add(entry.name.replace(/[^/]+$/, ''));
  }
  for (const entry of zip.entries) {
    const m = entry.name.match(/Microsoft\.PowerApps\/apps\/([^/]+)\/\1\.json/i);
    if (m && !appFoldersWithMsapp.has(entry.name.replace(/[^/]+$/, ''))) {
      const j=await extractJson(zip,entry.name);
      if (j) {
        const aid = guid(m[1]);
        getOrCreate(g,'canvasapp',aid,{displayName:j.displayName||j.name||m[1],filePath:entry.name});
        const refs = j.properties?.connectionReferences||j.connectionReferences||{};
        for (const ref of Object.values(refs)) {
          const fid=guid(ref.workflowId||ref.flowId);
          if(fid){getOrCreate(g,'flow',fid,{displayName:fid});addEdge(g,aid,fid,'app-calls-flow');}
        }
      }
    }
  }
  for (const entry of zip.entries) {
    if (entry.name.endsWith('.msapp')) { const sub=await extractSubZip(zip,entry.name); if(sub) await processMsapp(sub,entry.name,g); }
  }
}

// ── Main Entry ─────────────────────────────────────────────────────────────────
async function processFile(file) {
  setLoading(true,'Reading file…');
  const buf  = await file.arrayBuffer();
  setLoading(true,'Parsing ZIP…');
  const zip  = parseZip(buf);
  const type = await detectType(zip);
  const g    = createGraph();
  setLoading(true,`Processing ${type}…`);
  if      (type==='solution')    await processSolution(zip,g);
  else if (type==='app-package') await processAppPackage(zip,g);
  else if (type==='msapp')       await processMsapp(zip,'app.msapp',g);
  else throw new Error('Unrecognized package. Expected a Power Platform solution ZIP, app package ZIP, or .msapp file.');
  setLoading(true,'Rendering…');
  state.zip = zip;
  renderAll(g, file.name);
  setLoading(false);
}

// ── Visible Graph View ─────────────────────────────────────────────────────────
function buildVisibleGraph(g, filters) {
  const hiddenIds = new Set();
  for (const [id, n] of g.nodes) {
    if (!filters.showEnvVars && n.type === 'envvar') hiddenIds.add(id);
    if (!filters.showInactiveFlows && n.type === 'flow' && n.isActive === false) hiddenIds.add(id);
  }
  const nodes = new Map();
  for (const [id, n] of g.nodes) { if (!hiddenIds.has(id)) nodes.set(id, n); }
  const byType = new Map();
  for (const [type, ids] of g.byType) {
    const filtered = ids.filter(id => !hiddenIds.has(id));
    if (filtered.length) byType.set(type, filtered);
  }
  const edges = g.edges.filter(e => !hiddenIds.has(e.srcId) && !hiddenIds.has(e.dstId));
  return { ...g, nodes, byType, edges };
}

function rerender() {
  if (!state.G) return;
  for (const n of state.G.nodes.values()) n.svgEl = null;
  for (const e of state.G.edges) e.svgEl = null;
  const vg = buildVisibleGraph(state.G, state);
  computeLayout(vg);
  renderSvg(vg);
  renderLegend(vg);
  state.G.svgW = vg.svgW; state.G.svgH = vg.svgH;
  if (state.selId && vg.nodes.has(state.selId)) hlNode(state.selId, 'select');
  else state.selId = null;
  requestAnimationFrame(fitToView);
}

// ── SVG Layout ─────────────────────────────────────────────────────────────────
function computeLayout(g) {
  // sideCols holds only columns 0 (data) and 1 (flows); col 2 (apps) is laid out separately below
  const sideCols = [[],[]];
  for (const n of g.nodes.values()) { const c=COL_MAP[n.type]??2; if(c<2) sideCols[c].push(n); }
  for (const col of sideCols) col.sort((a,b)=>a.displayName.localeCompare(b.displayName));

  const panelW = document.getElementById('svg-panel').clientWidth || (SVG_PAD_X*2 + 3*COL_W + 2*COL_GAP);
  const dynGap = Math.max(COL_GAP, (panelW - SVG_PAD_X*2 - 3*COL_W) / 2);
  g.svgW = SVG_PAD_X*2 + 3*COL_W + 2*dynGap;

  const cx = [
    SVG_PAD_X + COL_W/2,
    SVG_PAD_X + COL_W + dynGap + COL_W/2,
    SVG_PAD_X + 2*(COL_W + dynGap) + COL_W/2,
  ];
  g.cx = cx;
  for (let c=0;c<2;c++) {
    let y = SVG_PAD_Y + 28;
    for (const n of sideCols[c]) { n.svgX=cx[c]; n.svgY=y; y+=NODE_H+NODE_GAP_Y; }
  }

  // Col 2: canvas apps with their child screens grouped, then ungrouped nodes
  g.appGroups = [];
  const apps = (g.byType.get('canvasapp')||[]).map(id=>g.nodes.get(id)).filter(Boolean);
  apps.sort((a,b)=>a.displayName.localeCompare(b.displayName));

  const screensByApp = new Map();
  for (const id of (g.byType.get('screen')||[])) {
    const sep = id.indexOf('::scr::');
    if (sep !== -1) {
      const pid = id.slice(0, sep);
      if (!screensByApp.has(pid)) screensByApp.set(pid,[]);
      screensByApp.get(pid).push(g.nodes.get(id));
    }
  }
  for (const screens of screensByApp.values()) screens.sort((a,b)=>a.displayName.localeCompare(b.displayName));

  const controlsByApp = new Map();
  for (const id of (g.byType.get('control')||[])) {
    const sep = id.indexOf('::ctrl::');
    if (sep !== -1) {
      const pid = id.slice(0, sep);
      if (!controlsByApp.has(pid)) controlsByApp.set(pid,[]);
      controlsByApp.get(pid).push(g.nodes.get(id));
    }
  }
  for (const ctrls of controlsByApp.values()) ctrls.sort((a,b)=>a.displayName.localeCompare(b.displayName));

  const groupedIds = new Set([
    ...[...screensByApp.values()].flat().map(n=>n.id),
    ...[...controlsByApp.values()].flat().map(n=>n.id),
  ]);
  const appIds = new Set(apps.map(n=>n.id));
  const ungrouped = [];
  for (const n of g.nodes.values()) {
    if ((COL_MAP[n.type]??2) !== 2) continue;
    if (appIds.has(n.id) || groupedIds.has(n.id)) continue;
    ungrouped.push(n);
  }
  ungrouped.sort((a,b)=>a.displayName.localeCompare(b.displayName));

  let y2 = SVG_PAD_Y + 28, lastBottom = SVG_PAD_Y*2;
  for (const app of apps) {
    const screens = screensByApp.get(app.id) || [];
    const ctrls  = controlsByApp.get(app.id) || [];
    if (screens.length > 0 || ctrls.length > 0) {
      y2 += GROUP_LABEL_H + GROUP_PAD_Y;
      const boxY = y2 - GROUP_LABEL_H - GROUP_PAD_Y;
      app.svgX=cx[2]; app.svgY=y2; y2+=NODE_H+NODE_GAP_Y; lastBottom=y2-NODE_GAP_Y;
      for (const scr of screens) { scr.svgX=cx[2]; scr.svgY=y2; y2+=NODE_H+NODE_GAP_Y; lastBottom=y2-NODE_GAP_Y; }
      for (const ctrl of ctrls)  { ctrl.svgX=cx[2]; ctrl.svgY=y2; y2+=NODE_H+NODE_GAP_Y; lastBottom=y2-NODE_GAP_Y; }
      g.appGroups.push({
        label: app.displayName,
        boxX: cx[2]-COL_W/2-GROUP_PAD_X, boxY,
        boxW: COL_W+GROUP_PAD_X*2, boxH: lastBottom+GROUP_PAD_Y-boxY,
        color: TYPE_COLORS.canvasapp.stroke,
      });
      y2 += GROUP_GAP;
    } else {
      app.svgX=cx[2]; app.svgY=y2; y2+=NODE_H+NODE_GAP_Y; lastBottom=y2-NODE_GAP_Y;
    }
  }
  for (const n of ungrouped) { n.svgX=cx[2]; n.svgY=y2; y2+=NODE_H+NODE_GAP_Y; lastBottom=y2-NODE_GAP_Y; }

  const col2H = lastBottom + SVG_PAD_Y;
  const maxH = Math.max(SVG_PAD_Y*2, col2H,
    ...sideCols.map(col=>col.length ? col[col.length-1].svgY+NODE_H+SVG_PAD_Y : SVG_PAD_Y*2)
  );
  g.svgH = maxH;
}

// ── Rendering ──────────────────────────────────────────────────────────────────
const state = {
  G: null, selId: null, zip: null, fname: null,
  tx: 0, ty: 0, scale: 1,
  _dragging: false, _dragMoved: false,
  _dragStartX: 0, _dragStartY: 0, _dragStartTx: 0, _dragStartTy: 0,
  showEnvVars: true,
  showInactiveFlows: true,
};

function applyTransform() {
  const tl = document.getElementById('transform-layer');
  if (tl) tl.setAttribute('transform', `translate(${state.tx},${state.ty}) scale(${state.scale})`);
}

function fitToView() {
  if (!state.G) return;
  const svg = document.getElementById('dep-graph');
  const vw = svg.clientWidth - FIT_PAD * 2;
  const vh = svg.clientHeight - FIT_PAD * 2;
  const s = Math.min(vw / state.G.svgW, vh / state.G.svgH, ZOOM_MAX);
  state.scale = s;
  state.tx = (svg.clientWidth  - state.G.svgW * s) / 2;
  state.ty = (svg.clientHeight - state.G.svgH * s) / 2;
  applyTransform();
}

function onWheel(e) {
  e.preventDefault();
  const svg = document.getElementById('dep-graph');
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (!e.ctrlKey && e.deltaX !== 0) {
    state.tx -= e.deltaX; state.ty -= e.deltaY; applyTransform(); return;
  }
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const newScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, state.scale * factor));
  const ratio = newScale / state.scale;
  state.tx = mx - ratio * (mx - state.tx);
  state.ty = my - ratio * (my - state.ty);
  state.scale = newScale;
  applyTransform();
}

const PAN_THRESHOLD = 4;
function onSvgMousedown(e) {
  if (e.button !== 0 || e.target.closest('.svg-node')) return;
  state._dragging = true; state._dragMoved = false;
  state._dragStartX = e.clientX; state._dragStartY = e.clientY;
  state._dragStartTx = state.tx; state._dragStartTy = state.ty;
  e.preventDefault();
}
function onDocMousemove(e) {
  if (!state._dragging) return;
  const dx = e.clientX - state._dragStartX, dy = e.clientY - state._dragStartY;
  if (!state._dragMoved && Math.hypot(dx, dy) > PAN_THRESHOLD) {
    state._dragMoved = true;
    document.getElementById('dep-graph').classList.add('panning');
  }
  if (state._dragMoved) {
    state.tx = state._dragStartTx + dx; state.ty = state._dragStartTy + dy;
    applyTransform();
  }
}
function onDocMouseup() {
  if (!state._dragging) return;
  state._dragging = false;
  document.getElementById('dep-graph').classList.remove('panning');
}

function renderAll(g, fname) {
  state.G = g; state.selId = null; state.fname = fname || null;
  state.showEnvVars = true; state.showInactiveFlows = true;
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('main-layout').style.display = 'flex';
  document.getElementById('solution-name').textContent = g.solutionName || '';
  for (const n of g.nodes.values()) n.svgEl = null;
  for (const e of g.edges) e.svgEl = null;
  const vg = buildVisibleGraph(g, state);
  computeLayout(vg);
  renderSvg(vg);
  renderLegend(vg);
  g.svgW = vg.svgW; g.svgH = vg.svgH;
  renderVisibilityControls(g);
  requestAnimationFrame(fitToView);
}

function svgEl(tag,attrs={}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg',tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,String(v));
  return el;
}

function renderSvg(g) {
  const svg   = document.getElementById('dep-graph');
  const defs  = document.getElementById('svg-defs');
  const grpL  = document.getElementById('groups-layer');
  const eL    = document.getElementById('edges-layer');
  const nL    = document.getElementById('nodes-layer');
  svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  svg.removeAttribute('viewBox');
  defs.innerHTML=''; grpL.innerHTML=''; eL.innerHTML=''; nL.innerHTML='';

  // App group bounding boxes
  for (const grp of (g.appGroups||[])) {
    const r=svgEl('rect',{x:grp.boxX,y:grp.boxY,width:grp.boxW,height:grp.boxH,
      rx:12,fill:'rgba(16,185,129,0.06)',stroke:grp.color,
      'stroke-width':1,'stroke-dasharray':'4 3',opacity:0.85});
    grpL.appendChild(r);
    const lbl=svgEl('text',{x:grp.boxX+10,y:grp.boxY+GROUP_LABEL_H-2,
      'font-size':9,'font-family':'system-ui,sans-serif',fill:grp.color,
      opacity:0.7,'font-weight':600,'letter-spacing':'0.05em'});
    lbl.textContent=grp.label.length>28?grp.label.slice(0,27)+'…':grp.label;
    grpL.appendChild(lbl);
  }

  // Arrowhead markers
  for (const [type,color] of Object.entries(EDGE_COLORS)) {
    const mk = svgEl('marker',{id:`ah-${type}`,markerWidth:10,markerHeight:7,refX:8,refY:3,orient:'auto'});
    const pl = svgEl('polygon',{points:'0 0, 8 3, 0 6',fill:color});
    mk.appendChild(pl); defs.appendChild(mk);
  }

  // Column labels
  const cx = g.cx;
  for (let c=0;c<3;c++) {
    const t=svgEl('text',{x:cx[c],y:SVG_PAD_Y+8,class:'col-label'});
    t.textContent=COL_LABELS[c]; nL.appendChild(t);
  }

  // Edges
  for (const edge of g.edges) {
    const src=g.nodes.get(edge.srcId), dst=g.nodes.get(edge.dstId);
    if (!src||!dst) continue;
    const color=EDGE_COLORS[edge.type]||'#6b7280';
    const sc=COL_MAP[src.type]??2, dc=COL_MAP[dst.type]??2;
    let x1, x2, pathD;
    const y1=src.svgY+NODE_H/2, y2=dst.svgY+NODE_H/2;
    if (sc === dc) {
      // Same-column: loop out the right side
      x1 = src.svgX + COL_W/2; x2 = dst.svgX + COL_W/2;
      const bulge = 60;
      pathD = `M${x1},${y1} C${x1+bulge},${y1} ${x2+bulge},${y2} ${x2},${y2}`;
    } else {
      if (sc < dc) { x1=src.svgX+COL_W/2; x2=dst.svgX-COL_W/2; }
      else         { x1=src.svgX-COL_W/2; x2=dst.svgX+COL_W/2; }
      const dx=(x2-x1)*0.4;
      pathD = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    }
    const eg=svgEl('g',{class:`svg-edge svg-edge-type-${edge.type}`});
    eg.dataset.src=edge.srcId; eg.dataset.dst=edge.dstId; eg.dataset.type=edge.type;
    const p=svgEl('path',{
      d:pathD, stroke:color,'stroke-width':1.5,fill:'none',opacity:0.75,
      'marker-end':`url(#ah-${edge.type})`
    });
    eg.appendChild(p); eL.appendChild(eg); edge.svgEl=eg;
  }

  // Nodes
  for (const n of g.nodes.values()) {
    const c=TYPE_COLORS[n.type]||TYPE_COLORS.control;
    const x=n.svgX-COL_W/2, y=n.svgY;
    const ng=svgEl('g',{class:'svg-node'}); ng.dataset.id=n.id;

    const rectAttrs = {x,y,width:COL_W,height:NODE_H,rx:NODE_RX,fill:c.fill,stroke:c.stroke,'stroke-width':1.5,class:'svg-node-rect'};
    if (n.type === 'flow' && n.isActive === false) { rectAttrs['stroke-dasharray'] = '5 3'; ng.style.opacity = '0.5'; }
    const rect=svgEl('rect',rectAttrs);
    ng.appendChild(rect);
    const titleEl=svgEl('title'); titleEl.textContent=n.displayName; ng.appendChild(titleEl);

    const ico=svgEl('text',{x:x+12,y:y+NODE_H/2+1,'dominant-baseline':'middle','font-size':18,fill:c.icon||''}); ico.textContent=TYPE_ICONS[n.type]??'?';
    if ((n.type === 'flow' || n.type === 'screen') && n.filePath) {
      const icoG = svgEl('g'); icoG.style.cursor = 'crosshair';
      const icoHit = svgEl('rect',{x:x+4,y:y+NODE_H/2-13,width:28,height:28,fill:'transparent'});
      icoG.appendChild(icoHit); icoG.appendChild(ico);
      icoG.addEventListener('click', e => { e.stopPropagation(); downloadNode(n.id); });
      ng.appendChild(icoG);
    } else {
      ng.appendChild(ico);
    }

    const lbl=svgEl('text',{x:x+36,y:y+NODE_H/2-7,'dominant-baseline':'middle','font-size':13,'font-family':'system-ui,sans-serif',fill:c.text||'#f9fafb','font-weight':600});
    lbl.textContent=n.displayName.length>NODE_LABEL_MAX_CHARS?n.displayName.slice(0,NODE_LABEL_MAX_CHARS-1)+'…':n.displayName;
    ng.appendChild(lbl);

    const sub=svgEl('text',{x:x+36,y:y+NODE_H/2+10,'dominant-baseline':'middle','font-size':11,'font-family':'system-ui,sans-serif',fill:c.text||'#f9fafb'});
    sub.textContent=(n.type==='datasource'&&n.siteUrl)?extractSiteName(n.siteUrl)
      :(n.type==='envvar')?envVarTypeLabel(n.envVarType)
      :(TYPE_LABELS[n.type]||n.type); ng.appendChild(sub);

    if (n.type === 'flow' && n.isActive === false) {
      const badgeX = x + COL_W - 38, badgeY = y + 6, badgeW = 32, badgeH = 16;
      const badgeBg = svgEl('rect',{x:badgeX,y:badgeY,width:badgeW,height:badgeH,rx:4,fill:'#dc2626'});
      ng.appendChild(badgeBg);
      const badgeTxt = svgEl('text',{x:badgeX+badgeW/2,y:badgeY+badgeH/2+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':9,'font-weight':700,'font-family':'system-ui,sans-serif',fill:'#fff','letter-spacing':'0.05em'});
      badgeTxt.textContent='OFF';
      ng.appendChild(badgeTxt);
    }

    ng.addEventListener('mouseenter',()=>{ if(state.selId!==n.id) hlNode(n.id,'hover'); });
    ng.addEventListener('mouseleave',()=>{ if(state.selId!==n.id) clearHL(); else hlNode(state.selId,'select'); });
    ng.addEventListener('click',()=>selNode(n.id,'svg'));
    nL.appendChild(ng); n.svgEl=ng;
  }

  // Click background (anything that isn't a node) to deselect
  svg.onclick = e => {
    if (state._dragMoved) { state._dragMoved = false; return; }
    if (!e.target.closest('.svg-node')) { state.selId=null; clearHL(); }
  };
  svg.onmousedown = onSvgMousedown;
}

function renderLegend(g) {
  const used=new Set(g.edges.map(e=>e.type));
  const leg=document.getElementById('legend'); leg.innerHTML='';
  for (const [type,color] of Object.entries(EDGE_COLORS)) {
    if (!used.has(type)) continue;
    const item=document.createElement('div'); item.className='legend-item';
    const line=document.createElement('div'); line.className='legend-line'; line.style.background=color;
    const label=document.createElement('span'); label.textContent=EDGE_LABELS[type];
    item.appendChild(line); item.appendChild(label);
    leg.appendChild(item);
  }
}

function renderVisibilityControls(g) {
  const hasEnvVars = (g.byType.get('envvar') || []).length > 0;
  const hasInactiveFlows = (g.byType.get('flow') || [])
    .some(id => { const n = g.nodes.get(id); return n && n.isActive === false; });
  const envBtn      = document.getElementById('toggle-envvar-btn');
  const inactiveBtn = document.getElementById('toggle-inactive-btn');
  envBtn.style.display      = hasEnvVars       ? '' : 'none';
  inactiveBtn.style.display = hasInactiveFlows ? '' : 'none';
  envBtn.classList.toggle('toggle-btn--off',      !state.showEnvVars);
  inactiveBtn.classList.toggle('toggle-btn--off', !state.showInactiveFlows);
}

// ── Cross-Highlighting ─────────────────────────────────────────────────────────
function hlNode(id, mode) {
  if (!state.G) return;
  clearHLClasses();
  const n=state.G.nodes.get(id); if(!n) return;
  const peerIds=new Set(), peerEdges=new Set();
  for (const e of state.G.edges) {
    if (e.srcId===id||e.dstId===id) {
      peerIds.add(e.srcId); peerIds.add(e.dstId); peerEdges.add(e);
    }
  }
  if(n.svgEl)  n.svgEl.classList.add(mode==='hover'?'svg-hovered':'svg-selected');
  for (const [nid,nd] of state.G.nodes) {
    if(nid===id) continue;
    if(nd.svgEl) nd.svgEl.classList.add(peerIds.has(nid)?'svg-peer':'svg-dimmed');
  }
  for (const e of state.G.edges) {
    if(!e.svgEl) continue;
    e.svgEl.classList.add(peerEdges.has(e)?'edge-highlighted':'edge-dimmed');
  }
}

function clearHLClasses() {
  if (!state.G) return;
  for (const n of state.G.nodes.values()) {
    if(n.svgEl)  n.svgEl.classList.remove('svg-hovered','svg-selected','svg-peer','svg-dimmed');
  }
  for (const e of state.G.edges) {
    if(e.svgEl) e.svgEl.classList.remove('edge-highlighted','edge-dimmed');
  }
}

function clearHL() { clearHLClasses(); }

function selNode(id) {
  state.selId=id; hlNode(id,'select');
}

// ── Utilities ──────────────────────────────────────────────────────────────────
function setLoading(on, msg='') {
  document.getElementById('loading-overlay').classList.toggle('active',on);
  if(msg) document.getElementById('loading-msg').textContent=msg;
}
function showError(msg) {
  const el=document.getElementById('error-msg'); el.textContent=msg; el.style.display='block';
  setLoading(false);
}
function showToast(msg, durationMs=2500) {
  setLoading(true, msg);
  setTimeout(() => setLoading(false), durationMs);
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildExportSvg() {
  const svg = document.getElementById('dep-graph');
  const clone = svg.cloneNode(true);

  // Strip interaction classes so exported nodes render in their default state
  for (const el of clone.querySelectorAll(
    '.svg-hovered,.svg-selected,.svg-peer,.svg-dimmed,.edge-highlighted,.edge-dimmed'
  )) {
    el.classList.remove('svg-hovered','svg-selected','svg-peer','svg-dimmed','edge-highlighted','edge-dimmed');
  }
  // Remove the panning cursor class
  clone.querySelector('#dep-graph, svg')?.classList?.remove('panning');

  const W = state.G.svgW, H = state.G.svgH;

  // Reset transform to identity — viewBox covers the full content
  clone.querySelector('#transform-layer')?.setAttribute('transform','translate(0,0) scale(1)');
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  clone.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Background fill (matches app gradient start colour)
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('x',0); bg.setAttribute('y',0);
  bg.setAttribute('width',W); bg.setAttribute('height',H);
  bg.setAttribute('fill','#e8eaf0');
  clone.insertBefore(bg, clone.firstChild);

  // Inline the styles needed for column labels (CSS class used in the SVG)
  const style = document.createElementNS('http://www.w3.org/2000/svg','style');
  style.textContent =
    '.col-label{font-size:13px;font-family:system-ui,sans-serif;font-weight:700;' +
    'text-anchor:middle;letter-spacing:0.08em;fill:#9ca3af;}';
  const defs = clone.querySelector('defs');
  if (defs) defs.appendChild(style);

  return clone;
}

function exportSvg() {
  if (!state.G) return;
  const clone = buildExportSvg();
  const svgStr = new XMLSerializer().serializeToString(clone);
  downloadBlob(
    new Blob([svgStr], {type:'image/svg+xml'}),
    exportFilename('svg')
  );
}

function exportPng() {
  if (!state.G) return;
  const clone = buildExportSvg();
  const svgStr = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([svgStr], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const W = state.G.svgW, H = state.G.svgH;
  const SCALE = 2; // 2× for crisp rendering on HiDPI displays
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = W * SCALE; canvas.height = H * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    canvas.toBlob(png => downloadBlob(png, exportFilename('png')), 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); showToast('PNG export failed — try SVG instead.'); };
  img.src = url;
}

function exportFilename(ext) {
  const name = (state.G?.solutionName || state.fname?.replace(/\.[^.]+$/,'') || 'solution-explorer')
    .replace(/[^a-z0-9_\-. ]/gi,'_').replace(/\s+/g,'-').toLowerCase();
  return `${name}.${ext}`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── SharePoint URL Copy ───────────────────────────────────────────────────────
function buildSharePointListUrl(n) {
  if (!n.siteUrl?.startsWith('https://')) return null;
  return n.siteUrl.replace(/\/$/, '') + '/Lists/' + encodeURIComponent(n.displayName) + '/AllItems.aspx';
}

function showCopyFeedback(nodeEl, x, y) {
  nodeEl.querySelector('.copy-feedback')?.remove();
  const fb = svgEl('text', {
    x: x + COL_W/2, y: y + NODE_H/2,
    'text-anchor':'middle','dominant-baseline':'middle',
    'font-size':12,'font-weight':700,'font-family':'system-ui,sans-serif',
    fill:'#fff', 'pointer-events':'none', class:'copy-feedback',
  });
  fb.textContent = '✓ URL Copied!';
  nodeEl.appendChild(fb);
  setTimeout(() => fb.remove(), 1500);
}

async function copySharePointUrl(n, nodeEl, x, y) {
  const url = buildSharePointListUrl(n);
  if (!url) return;
  try {
    await navigator.clipboard.writeText(url);
    showCopyFeedback(nodeEl, x, y);
  } catch { /* clipboard unavailable (non-https context) */ }
}

// ── Node File Download ────────────────────────────────────────────────────────
async function downloadNode(id) {
  const n = state.G?.nodes.get(id);
  if (!n || !n.filePath || !state.zip) return;
  let sourceZip = state.zip;
  if (n.type === 'screen') {
    const appId = n.id.split('::scr::')[0];
    const appNode = state.G.nodes.get(appId);
    const msappPath = appNode?.filePath;
    if (msappPath && msappPath !== 'app.msapp') {
      const msappEntry = findE(state.zip, msappPath);
      if (!msappEntry) { showToast('Could not locate app package in ZIP.'); return; }
      const msappBytes = await extractEntry(state.zip, msappEntry);
      sourceZip = parseZip(msappBytes.buffer);
    }
  }
  const entry = findE(sourceZip, n.filePath);
  if (!entry) { showToast('File not found in package.'); return; }
  const bytes = await extractEntry(sourceZip, entry);
  const ext = n.filePath.split('.').pop() || 'json';
  const mime = ext === 'yaml' ? 'text/yaml' : 'application/json';
  const filename = n.displayName.replace(/[^a-z0-9_\-. ]/gi,'_') + '.' + ext;
  downloadBlob(new Blob([bytes], {type: mime}), filename);
}


// ── Drop Zone ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Visibility toggles
  document.getElementById('toggle-envvar-btn').addEventListener('click', () => {
    state.showEnvVars = !state.showEnvVars;
    document.getElementById('toggle-envvar-btn').classList.toggle('toggle-btn--off', !state.showEnvVars);
    rerender();
  });
  document.getElementById('toggle-inactive-btn').addEventListener('click', () => {
    state.showInactiveFlows = !state.showInactiveFlows;
    document.getElementById('toggle-inactive-btn').classList.toggle('toggle-btn--off', !state.showInactiveFlows);
    rerender();
  });

  // Reset
  document.getElementById('reset-btn').addEventListener('click',()=>{
    state.G=null; state.selId=null; state.zip=null; state.fname=null;
    state.tx=0; state.ty=0; state.scale=1;
    state._dragging=false; state._dragMoved=false;
    document.getElementById('main-layout').style.display='none';
    document.getElementById('drop-zone').style.display='flex';
    document.getElementById('error-msg').style.display='none';
    document.getElementById('file-input').value='';
    document.getElementById('solution-name').textContent='';
  });

  // Export dropdown
  const exportMenu = document.getElementById('export-menu');
  document.getElementById('export-btn').addEventListener('click', e => {
    e.stopPropagation();
    exportMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => { exportMenu.classList.remove('open'); });
  document.getElementById('export-svg-btn').addEventListener('click', () => { exportMenu.classList.remove('open'); exportSvg(); });
  document.getElementById('export-png-btn').addEventListener('click', () => { exportMenu.classList.remove('open'); exportPng(); });

  document.addEventListener('mousemove', onDocMousemove);
  document.addEventListener('mouseup', onDocMouseup);
  document.getElementById('dep-graph').addEventListener('wheel', onWheel, {passive: false});

  document.getElementById('zoom-fit-btn').addEventListener('click', fitToView);
  document.getElementById('zoom-in-btn').addEventListener('click', () => {
    const svg=document.getElementById('dep-graph');
    const cx=svg.clientWidth/2, cy=svg.clientHeight/2;
    const s=Math.min(ZOOM_MAX, state.scale*1.25), r=s/state.scale;
    state.tx=cx-r*(cx-state.tx); state.ty=cy-r*(cy-state.ty); state.scale=s;
    applyTransform();
  });
  document.getElementById('zoom-out-btn').addEventListener('click', () => {
    const svg=document.getElementById('dep-graph');
    const cx=svg.clientWidth/2, cy=svg.clientHeight/2;
    const s=Math.max(ZOOM_MIN, state.scale/1.25), r=s/state.scale;
    state.tx=cx-r*(cx-state.tx); state.ty=cy-r*(cy-state.ty); state.scale=s;
    applyTransform();
  });

  // File input
  const fi=document.getElementById('file-input');
  document.getElementById('browse-label').addEventListener('click',()=>fi.click());
  fi.addEventListener('change',()=>{ if(fi.files[0]) handle(fi.files[0]); });

  // Drag-and-drop
  const dz=document.getElementById('drop-zone');
  dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault(); dz.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
  });

  async function handle(file) {
    document.getElementById('error-msg').style.display='none';
    try { await processFile(file); }
    catch(err) { console.error(err); showError('Error: '+err.message); }
  }
});
