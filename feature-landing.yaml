                          =Filter(Table({Artwork: "Color Harmony Study", Artist: "Emma Carter", Email: "emma.carter@example.com", Phone: "(555) 555-0142", Portfolio: "https://www.example.com/emma", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Brush Technique Vol.2", Artist: "Liam Brooks", Email: "liam.brooks@example.com", Phone: "(555) 555-0188", Portfolio: "https://www.example.com/liam", Medium: "Acrylic", Status: "◐ In review"}, {Artwork: "Palette Preferences", Artist: "Ava Mitchell", Email: "ava.mitchell@example.com", Phone: "(555) 555-0119", Portfolio: "https://www.example.com/ava", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Texture Study Sheet", Artist: "Noah Bennett", Email: "noah.bennett@example.com", Phone: "(555) 555-0204", Portfolio: "https://www.example.com/noah", Medium: "Gouache", Status: "○ Draft"}, {Artwork: "Gradient Flow Guide", Artist: "Sophia Reed", Email: "sophia.reed@example.com", Phone: "(555) 555-0337", Portfolio: "https://www.example.com/sophia", Medium: "Watercolor", Status: "◐ In review"}, {Artwork: "Wash Layer Tracker", Artist: "Mason Clark", Email: "mason.clark@example.com", Phone: "(555) 555-0153", Portfolio: "https://www.example.com/mason", Medium: "Ink", Status: "○ Draft"}, {Artwork: "Pigment Mix Log", Artist: "Olivia Nash", Email: "olivia.nash@example.com", Phone: "(555) 555-0291", Portfolio: "https://www.example.com/olivia", Medium: "Oil", Status: "● Active"}, {Artwork: "Water Ratio Form", Artist: "Ethan Rice", Email: "ethan.rice@example.com", Phone: "(555) 555-0420", Portfolio: "https://www.example.com/ethan", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Edge Control Survey", Artist: "Harper Gray", Email: "harper.gray@example.com", Phone: "(555) 555-0176", Portfolio: "https://www.example.com/harper", Medium: "Graphite", Status: "◐ In review"}, {Artwork: "Bloom Effect Report", Artist: "Isabella Fox", Email: "isabella.fox@example.com", Phone: "(555) 555-0388", Portfolio: "https://www.example.com/isabella", Medium: "Acrylic", Status: "○ Draft"}), IsBlank(RecentSearchInput2.Text) || RecentSearchInput2.Text in Artwork || RecentSearchInput2.Text in Artist || RecentSearchInput2.Text in Email || RecentSearchInput2.Text in Phone || RecentSearchInput2.Text in Portfolio || RecentSearchInput2.Text in Medium || RecentSearchInput2.Text in Status)
                        LayoutMinHeight: =16
