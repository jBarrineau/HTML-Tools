                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =(RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) * If(App.Width < 640, 200, 220)) + ((RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) - 1) * 16) + 8 + 8
                  LayoutGap: =16
                  LayoutGridColumnMinWidth: =(Parent.Width - 2 * If(App.Width < 640, 16, 40) - (If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 1) * 16) / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 4
                  LayoutGridColumns: =If(App.Width < 640, 1, If(App.Width < 1024, 2, 3))
                  LayoutGridRowMinHeight: =If(App.Width < 640, 200, 220)
                  LayoutGridRows: =RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =48
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =0
                Children:
                  - QuickCard_12:
                      Control: ModernCard@1.3.0
                      Properties:
                        Subtitle: ="Explore techniques that bring your ideas to life with rich acrylic textures."
                        Title: ="Acrylic Adventures"
                  - QuickCard_22:
                      Control: ModernCard@1.3.0
                      Properties:
                        HeaderImage: =SampleCardHeaderImageDesigner
                        Image: =SampleCardImageShapes3D
                        Subtitle: ="Turn simple lines into powerful narratives. Learn how to sketch and tell stories."
                        Title: ="Sketch & Story"
                  - QuickCard_32:
                      Control: ModernCard@1.3.0
                      Properties:
                        HeaderImage: =SampleCardHeaderImageM365
                        Image: =SampleCardImageFluidTexture
                        Subtitle: ="Perfect for beginners and pros who love expressive, flowing art."
                        Title: ="Watercolor Wonders"
            - EventsHeader3:
                Control: ModernText@1.0.0
                Properties:
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =6
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingTop: =40
                  Size: =18
                  Text: =If(App.Width < 640, "Upcoming Events", "Events")
                  VerticalAlign: =VerticalAlign.Bottom
            - EventsCardGrid3:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
