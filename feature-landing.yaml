                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =6
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingTop: =40
                  Size: =18
                  Text: ="Quick access"
                  VerticalAlign: =VerticalAlign.Bottom
            - QuickCardGrid2:
                Control: GroupContainer@1.5.0
                Variant: GridLayout
