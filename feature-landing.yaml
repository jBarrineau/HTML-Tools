Screens:
  Screen5:
    Children:
      - FeatureScroll1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            Width: =Parent.Width
          Children:
            - TopNav3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                Children:
                  - TitleRow3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitle3:
                            Control: ModernText@1.0.0
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =If(App.Width < 640, 13, 16)
                              Text: ="Watercolor Wonders"
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktop3:
                            Control: ModernTabList@1.0.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =TabListAppearance.Subtle
                              Default: |-
                                ={Value: "Home"}
                              FillPortions: =1
                              Height: =56
                              Items: =["Home", "Resources", "Events", "Gallery"]
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Visible: =App.Width >= 640
                        - IconChat3:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =24
                              Icon: ="Message"
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconShare3:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =24
                              Icon: ="Share"
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettings3:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =24
                              Icon: ="Settings"
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - Avatar3:
                            Control: Avatar@1.0.40
                            Properties:
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =32
                  - NavTabsMobile3:
                      Control: ModernTabList@1.0.1
                      Properties:
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Home"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table({Value: "Home"}, {Value: "Resources"}, {Value: "Events"}, {Value: "Gallery"})
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width
            - NavDivider3:
                Control: ModernText@1.0.0
                Properties:
                  Fill: =RGBA(237, 237, 237, 1)
                  Height: =2
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: =""
            - TitleBand2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 200, 180)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =48
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =40
                Children:
                  - FeatureTitle1:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =If(App.Width < 640, 22, 32)
                        Text: ="Watercolor Wonders"
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                  - FeatureSubtitle1:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =If(App.Width < 640, 12, 14)
                        Text: ="Discover the beauty of fluid colors and soft gradients. Perfect for beginners and seasoned artists who love the elegance of water-based art."
