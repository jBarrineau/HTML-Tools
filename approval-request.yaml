                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - TitleRow5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
